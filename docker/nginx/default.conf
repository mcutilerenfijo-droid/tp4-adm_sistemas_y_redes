# Configuración de nginx del TP2 (montada en /etc/nginx/conf.d/default.conf).
# nginx corre como el usuario "nginx" (uid 101) del contenedor, así que solo puede leer
# lo que el sistema permite a "otros": home con 711, public_html con 755, archivos con 644.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;   # página principal con los enlaces a /~usuario/
    index index.html;

    # Nunca servir archivos ocultos (.htpasswd, .ssh, .bashrc, ...).
    location ~ /\. {
        deny all;
    }

    # /~kakashi  ->  /~kakashi/
    location ~ ^/~([a-z_][a-z0-9_-]*)$ {
        return 301 /~$1/;
    }

    # Bonus: /~<usuario>/privado/ pide usuario y contraseña (HTTP Basic).
    # Tiene que ir antes que la regla general: nginx usa la primera regex que coincide.
    location ~ ^/~([a-z_][a-z0-9_-]*)/privado(/.*)?$ {
        alias /home/$1/public_html/privado$2;
        auth_basic           "Area privada";
        auth_basic_user_file /etc/nginx/tp2/htpasswd;
        autoindex on;
        disable_symlinks if_not_owner;
    }

    # /~<usuario>/<ruta>  ->  /home/<usuario>/public_html/<ruta>
    # Funciona para cualquier usuario nuevo sin tocar esta configuración.
    location ~ ^/~([a-z_][a-z0-9_-]*)(/.*)$ {
        alias /home/$1/public_html$2;
        autoindex on;
        # Evita que un usuario publique, con un symlink, archivos que no son suyos.
        disable_symlinks if_not_owner;
    }
}
