# /etc/systemd/system/docker.service.d/10-espera-wg0.conf
#
# Los contenedores publican sus puertos en 10.0.0.1, la IP de wg0. Si Docker arrancara
# antes que la VPN, esa IP todavía no existiría ("cannot assign requested address") y los
# contenedores quedarían caídos después de un reinicio. Esto obliga a esperar a wg0.
[Unit]
Wants=wg-quick@wg0.service
After=wg-quick@wg0.service
