# /etc/ssh/sshd_config.d/00-tp2.conf — Endurecimiento de SSH del TP2.
#
# Se llama 00-* a propósito: sshd se queda con el PRIMER valor que lee y los archivos de
# sshd_config.d se leen en orden alfabético. Así gana sobre 50-cloud-init.conf, que en
# Ubuntu Server suele traer "PasswordAuthentication yes".
#
# Verificar con:  sudo sshd -T | grep -Ei 'passwordauth|kbdinteractive|permitroot|allowgroups'

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# Solo entran los usuarios del grupo sshusers (setup.sh agrega al admin y a los usuarios del TP).
AllowGroups sshusers

MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
